<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Love Heart ❤️</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; min-height:100%; background:#060208; }
  body { overflow:hidden; font-family:Arial, sans-serif; }
  canvas { display:block; width:100vw; height:100dvh; }
  .hint { position:fixed; bottom:14px; left:0; right:0; text-align:center;
          color:#a98798; font-size:12px; opacity:.75; pointer-events:none; }
</style>
</head>
<body>
<canvas id="love"></canvas>
<div class="hint">made with love ❤️</div>
<script>
(() => {
  const canvas = document.getElementById('love');
  const ctx = canvas.getContext('2d');
  const phrases = [
    "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
    "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
    "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
    "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
    "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
  ];
  let W, H, dpr, items = [], start = performance.now(), last = 0;
  const bg = '#060208';
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    build();
  }
  function heart(t) {
    return {x:16*Math.pow(Math.sin(t),3), y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))};
  }
  function inside(x,y) {
    // normalized implicit heart, robustly tested with the standard heart equation
    const X=x/Math.min(W*0.037, 17), Y=-y/Math.min(H*0.037, 17);
    const a=X*X+Y*Y-1;
    return a*a*a-X*X*Y*Y*Y <= 0;
  }
  function build() {
    items = [];
    const scale = Math.min(W/38, H/35, 17);
    const cx=W/2, cy=H/2;
    const step=Math.max(15, Math.min(23, W/18));
    const rowStep=Math.max(15, Math.min(22, H/28));
    let k=0;
    for(let y=-14.5*scale; y<=14.5*scale; y+=rowStep) {
      for(let x=-16.5*scale; x<=16.5*scale; x+=step) {
        if(inside(x,y)) {
          const phrase=phrases[k++ % phrases.length];
          const size= Math.max(8, Math.min(12, W/36)) * (0.85+Math.random()*0.25);
          items.push({x:cx+x+(Math.random()-.5)*5, y:cy+y,
            phrase, size, delay:Math.random()*2100, drift:(Math.random()-.5)*18,
            color:`hsl(${345+Math.random()*18} ${78+Math.random()*20}% ${42+Math.random()*25}%)`,
            phase:Math.random()*Math.PI*2});
        }
      }
    }
    // edges tend to appear first for a clearer heart silhouette
    items.sort((a,b) => Math.abs(a.x-cx)-Math.abs(b.x-cx) + (Math.random()-.5)*10);
    start=performance.now();
  }
  function draw(now) {
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    const elapsed=now-start;
    for(const p of items) {
      const u=Math.max(0,Math.min(1,(elapsed-p.delay)/1050));
      if(u<=0) continue;
      const ease=1-Math.pow(1-u,3);
      const x=p.x+p.drift*(1-ease);
      const y=p.y+30*(1-ease);
      const pulse=elapsed>3200 ? (0.78+0.22*Math.sin(elapsed/500+p.phase)) : 1;
      ctx.globalAlpha=ease*pulse;
      ctx.font=`bold ${p.size}px Arial, sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor=p.color; ctx.shadowBlur=5;
      ctx.fillStyle=p.color;
      ctx.fillText(p.phrase,x,y);
    }
    ctx.globalAlpha=1; ctx.shadowBlur=0;
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
