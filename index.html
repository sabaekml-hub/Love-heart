
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Heart ❤️</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #060208;
  font-family: Arial, sans-serif;
}
canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}
.hint {
  position: fixed;
  bottom: 14px;
  width: 100%;
  text-align: center;
  color: #a98798;
  font-size: 12px;
  opacity: .75;
  pointer-events: none;
}
</style>
</head>
<body>
<canvas id="love"></canvas>
<div class="hint">made with love 💗</div>
<script>
(() => {
const canvas = document.getElementById("love");
const ctx = canvas.getContext("2d");
const phrases = [
"I love you","Seni seviyorum","Te amo","Je t'aime",
"Ich liebe dich","Ti amo","Eu te amo","Я тебя люблю",
"사랑해","愛してる","我爱你","मैं तुमसे प्यार करता हूँ",
"Σ' αγαπώ","Ik hou van jou","Jag älskar dig","Kocham cię",
"ฉันรักเธอ","Anh yêu em","Aku cinta kamu","Я тебе кохаю"
];
let W,H,dpr,items=[],start=performance.now();
const bg="#060208";

function resize(){
 dpr=Math.min(window.devicePixelRatio||1,2);
 W=window.innerWidth; H=window.innerHeight;
 canvas.width=Math.round(W*dpr);
 canvas.height=Math.round(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 build();
}
function heart(t){
 return {
  x:16*Math.pow(Math.sin(t),3),
  y:13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)
 };
}
function inside(x,y){
 const xx=x/16, yy=y/13;
 return Math.pow(xx*xx+yy*yy-1,3)-xx*xx*yy*yy*yy<=0;
}
function build(){
 items=[];
 const scale=Math.min(W/38,H/35);
 const cx=W/2, cy=H/2-8;
 let k=0;
 for(let y=-14;y<=14;y+=0.85){
  for(let x=-16.5;x<=16.5;x+=0.65){
   if(inside(x,y)){
    const phrase=phrases[k++%phrases.length];
    const size= Math.max(7,Math.min(12,W/36));
    const hue=350+Math.random()*18;
    const light=32+Math.random()*25;
    items.push({
     x:cx+x*scale, y:cy-y*scale,
     phrase,size,
     delay:Math.random()*8500,
     color:`hsl(${hue} 92% ${light}%)`,
     drift:(Math.random()-.5)*18
    });
   }
  }
 }
 items.sort((a,b)=>Math.atan2(a.x-cx,cy-a.y)-Math.atan2(b.x-cx,cy-b.y));
}
function draw(now){
 ctx.fillStyle=bg;
 ctx.fillRect(0,0,W,H);
 const elapsed=now-start;
 for(const p of items){
  const progress=Math.max(0,Math.min(1,(elapsed-p.delay)/1800));
  if(progress<=0) continue;
  const ease=1-Math.pow(1-progress,3);
  const x=p.x+p.drift*(1-ease);
  const y=p.y+34*(1-ease);
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.font=`bold ${p.size}px Arial,sans-serif`;
  ctx.globalAlpha=progress;
  ctx.shadowColor=p.color;
  ctx.shadowBlur=5;
  ctx.fillStyle=p.color;
  ctx.fillText(p.phrase,x,y);
  if(Math.sin(now/350+p.x)>0.985){
   ctx.fillStyle="#ffc6d0";
   ctx.fillText(p.phrase,x,y);
  }
 }
 ctx.globalAlpha=1;
 ctx.shadowBlur=0;
 requestAnimationFrame(draw);
}
window.addEventListener("resize",resize);
resize();
requestAnimationFrame(draw);
})();
</script>
</body>
</html>
